name = full
owner = conf
title = Full
version = 0.1.0
protocol = 1
runtime = python3
run = EXT_PY
on = command
future_key = whatever

[commands]
go = Go
go2 = Go Two

[subscribe]
opened = *
saved = *
changed = *
cursor = *
selection = *

[needs]
documents = write
# the spawn op starts sleep, which a confined extension may run only when it says so
run = sleep

[future]
anything = 1
