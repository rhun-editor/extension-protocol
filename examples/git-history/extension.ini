# git-history: an example of a retained tree view (protocol 1.1, features view-tree and git-data):
# the project's commits in a sidebar section, 200 at a time ("Load more"), each one's changed files
# asked for when it is expanded, a click on a file opening it.
name = git-history
owner = rhun-editor
title = Git History
description = The project's commits, paged, with the files each one changed.
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/git-history-linux-x86_64
run.macos-arm64 = bin/git-history-macos-arm64
run.windows-x64 = bin/git-history-windows-x64.exe
on = command

[commands]
refresh = Git History: Refresh

[needs]
project = read
# the history through rhun (git-log); the files a commit changed through git itself
git = read
run = git

[views]
history.title = History
history.place = sidebar
history.kind = tree
