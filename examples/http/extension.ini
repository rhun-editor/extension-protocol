# http: an example of a form view and a doc tab (protocol 1.1, features view-tree, view-form,
# view-doc and progress): a request form in the panel; Send shows progress you can cancel, then
# the response (status, headers, the body, JSON indented and highlighted) in a tab of its own.
name = http
owner = rhun-editor
title = HTTP Client
description = Send HTTP requests from a form in the panel; responses open as documents.
version = 0.1.0
protocol = 1
run.linux-x86_64 = bin/http-linux-x86_64
run.macos-arm64 = bin/http-macos-arm64
run.windows-x64 = bin/http-windows-x64.exe
on = command

[commands]
send = HTTP: Send the Request

[needs]
network = yes

[views]
request.title = HTTP
request.place = panel
request.kind = form
